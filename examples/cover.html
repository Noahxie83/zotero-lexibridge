<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LexiBridge 词译桥封面</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f8fa; color: #243746; }
    .cover {
      width: 1600px;
      height: 720px;
      display: grid;
      grid-template-columns: 800px 1fr;
      overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    .copy { padding: 67px 64px 76px 80px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .logo-crop { display: block; width: 208px; overflow: hidden; }
    .logo { display: block; width: 245px; height: 48px; }
    .brand-name { color: #596e7e; font-size: 22px; font-weight: 400; letter-spacing: .12em; }
    .message { margin-block: auto; padding-top: 16px; }
    h1 {
      margin: 0;
      font-family: 'DengXian', 'Microsoft YaHei', sans-serif;
      font-size: 80px;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: .015em;
    }
    h1 span { display: block; white-space: nowrap; }
    h1 span:last-child { color: #246a96; }
    .intro { margin: 28px 0 0; font-size: 24px; font-weight: 400; line-height: 1.85; color: #596e7e; letter-spacing: .025em; }
    .intro span { display: block; }
    .visual { margin: 32px 32px 32px 0; overflow: hidden; border-radius: 16px; }
    .photo { width: 100%; height: 100%; object-fit: cover; object-position: 68% center; display: block; }
  </style>
</head>
<body>
  <main class="cover" aria-label="LexiBridge 词译桥：Zotero 本地词典与在线翻译">
    <div class="copy">
      <div class="brand">
        <span class="logo-crop"><img class="logo" src="../docs/assets/wordmark.svg" width="245" height="48" alt="LexiBridge"></span>
        <span class="brand-name">词译桥</span>
      </div>
      <div class="message">
        <h1><span>查一个词，</span><span>读懂下一句。</span></h1>
        <p class="intro"><span>Zotero 本地词典与在线翻译</span><span>让查词留在阅读里。</span></p>
      </div>
    </div>
    <div class="visual">
      <img class="photo" src="../docs/assets/reading-desk.webp" width="1536" height="1024" alt="柔和日光下的蓝色布面词典与书签">
    </div>
  </main>
</body>
</html>
